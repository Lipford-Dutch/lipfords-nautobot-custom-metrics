---
name: "CI"
concurrency:  # Cancel any existing runs of this workflow for this same PR
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
on: # yamllint disable-line rule:truthy rule:comments
  push:
    branches:
      - "main"
      - "develop"
    tags:
      - "v*"
  pull_request: ~

jobs:
  lint:
    runs-on: "ubuntu-22.04"
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v4"
      - name: "Set up Python"
        uses: "actions/setup-python@v5"
        with:
          python-version: "3.12"
      - name: "Install ruff"
        run: "python -m pip install ruff==0.5.5"
      - name: "Linting: ruff"
        run: "ruff check tns_custom_metrics"

  unittest:
    needs:
      - "lint"
    runs-on: "ubuntu-22.04"
    strategy:
      fail-fast: false
      matrix:
        # Nautobot 3.x supports Python 3.10-3.14; 3.14 is the runtime requested by the owner.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    services:
      postgres:
        image: "postgres:16"
        env:
          POSTGRES_USER: "nautobot"
          POSTGRES_PASSWORD: "nautobot"
          POSTGRES_DB: "nautobot"
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U nautobot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: "redis:7"
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NAUTOBOT_CONFIG: "development/ci_config.py"
      NAUTOBOT_SECRET_KEY: "ci-only-not-a-secret-0123456789-0123456789"
      NAUTOBOT_DB_HOST: "localhost"
      NAUTOBOT_DB_NAME: "nautobot"
      NAUTOBOT_DB_USER: "nautobot"
      NAUTOBOT_DB_PASSWORD: "nautobot"
      NAUTOBOT_REDIS_HOST: "localhost"
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v4"
      - name: "Set up Python ${{ matrix.python-version }}"
        uses: "actions/setup-python@v5"
        with:
          python-version: "${{ matrix.python-version }}"
      - name: "Install Nautobot and the app"
        run: |
          python -m pip install --upgrade pip
          python -m pip install "nautobot>=3.1,<4.0" factory-boy .
      - name: "Nautobot system checks"
        run: "nautobot-server check"
      - name: "Verify no missing migrations"
        run: "nautobot-server makemigrations --check --dry-run"
      - name: "Run tests"
        run: "nautobot-server test tns_custom_metrics"

  publish_gh:
    needs:
      - "unittest"
    name: "Publish to GitHub"
    runs-on: "ubuntu-22.04"
    if: "startsWith(github.ref, 'refs/tags/v')"
    permissions:
      contents: "write"
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v4"
      - name: "Set up Python"
        uses: "actions/setup-python@v5"
        with:
          python-version: "3.12"
      - name: "Install Python Packages"
        run: "pip install poetry"
      - name: "Set env"
        run: "echo RELEASE_VERSION=${GITHUB_REF:10} >> $GITHUB_ENV"
      - name: "Run Poetry Version"
        run: "poetry version $RELEASE_VERSION"
      - name: "Install Dependencies (needed for mkdocs)"
        run: "poetry install --no-root"
      - name: "Build Documentation"
        run: "poetry run invoke build-and-check-docs"
      - name: "Run Poetry Build"
        run: "poetry build"
      - name: "Upload binaries to release"
        uses: "svenstaro/upload-release-action@v2"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          file: "dist/*"
          tag: "${{ github.ref }}"
          overwrite: true
          file_glob: true

  publish_pypi:
    needs:
      - "unittest"
    name: "Push Package to PyPI"
    runs-on: "ubuntu-22.04"
    if: "startsWith(github.ref, 'refs/tags/v')"
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v4"
      - name: "Set up Python"
        uses: "actions/setup-python@v5"
        with:
          python-version: "3.12"
      - name: "Install Python Packages"
        run: "pip install poetry"
      - name: "Set env"
        run: "echo RELEASE_VERSION=${GITHUB_REF:10} >> $GITHUB_ENV"
      - name: "Run Poetry Version"
        run: "poetry version $RELEASE_VERSION"
      - name: "Install Dependencies (needed for mkdocs)"
        run: "poetry install --no-root"
      - name: "Build Documentation"
        run: "poetry run invoke build-and-check-docs"
      - name: "Run Poetry Build"
        run: "poetry build"
      - name: "Push to PyPI"
        uses: "pypa/gh-action-pypi-publish@release/v1"
        with:
          user: "__token__"
          password: "${{ secrets.PYPI_API_TOKEN }}"
